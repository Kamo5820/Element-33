<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduvos Marketplace - Auth</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        :root { --primary-blue: #0062e9; --primary-blue-hover: #004fbd; }
        #fade-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 9999; }
        #fade-overlay.active { opacity: 1; pointer-events: all; }
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; background-color: var(--primary-blue); }
        .btn-submit:hover { background-color: var(--primary-blue-hover); }
        .role-select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; outline: none; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 12px auto; }
        .form-box { display: none; }
        .form-box.active { display: block; }
        /* Google Translate Style */
        #google_translate_element { position: absolute; top: 20px; right: 20px; z-index: 10000; }
    </style>
</head>
<body>
    <!-- LANGUAGE TRANSLATOR -->
    <div id="google_translate_element"></div>

    <div class="auth-container">
        <div class="auth-left">
            <video class="banner-video" autoplay muted loop playsinline><source src="pictures/vision.mp4" type="video/mp4"></video>
            <div class="video-overlay"></div>
            <div class="branding-content">
                <div class="logo"><span class="logo-icon">E</span><span class="logo-text">duvos Marketplace</span></div>
                <h1>Buy, Sell & Discover on Campus</h1>
                <p>Join thousands of students trading textbooks, electronics, and everything in between.</p>
            </div>
        </div>
        <div class="auth-right">
            <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <a href="Admin/Admin portal.html" class="admin-link" style="text-decoration: none; color: #ef4444; font-weight: 600; font-size: 14px;">Admin Portal</a>
            </div>
            <div class="form-wrapper" style="position: relative;">
                <form id="login-form" class="form-box active">
                    <h2 style="margin-bottom: 20px;">Welcome Back</h2>
                    <div class="form-group"><label>Email *</label><input type="email" id="login-email" required></div>
                    <div class="form-group"><label>Password *</label><input type="password" id="login-password" required></div>
                    <div class="form-group"><label>Log in as *</label>
                        <select id="login-role" class="role-select" required>
                            <option value="Buyer">Buyer</option>
                            <option value="Seller">Seller</option>
                        </select>
                    </div>
                    <p id="login-error" style="color: #ef4444; font-size: 14px; text-align: center; display: none;"></p>
                    <button type="submit" class="btn-submit">Log In</button>
                    <p class="toggle-text" style="margin-top: 15px; text-align: center;">Don't have an account? <a href="#" id="go-to-signup" style="color: var(--primary-blue);">Sign up</a></p>
                </form>
                <form id="signup-form" class="form-box">
                    <h2>Create an Account</h2>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex: 1;"><label>First name *</label><input type="text" id="signup-fname" required></div>
                        <div class="form-group" style="flex: 1;"><label>Last name *</label><input type="text" id="signup-lname" required></div>
                    </div>
                    <div class="form-group"><label>Email *</label><input type="email" id="signup-email" required></div>
                    <div class="form-group"><label>Sign up as *</label>
                        <select id="signup-role" class="role-select" required>
                            <option value="Buyer">Buyer</option>
                            <option value="Seller">Seller</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Location (Campus) *</label>
                        <select id="signup-location" class="role-select" required>
                            <option value="Pretoria">Pretoria</option><option value="Midrand">Midrand</option><option value="Durban">Durban</option><option value="Cape Town">Cape Town</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Password *</label><input type="password" id="signup-password" required></div>
                    <p id="signup-error" style="color: #ef4444; font-size: 14px; text-align: center; display: none;"></p>
                    <button type="submit" class="btn-submit">Sign Up</button>
                    <p class="toggle-text" style="margin-top: 15px; text-align: center;">Already have an account? <a href="#" id="go-to-login" style="color: var(--primary-blue);">Log in</a></p>
                </form>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        const API_BASE_URL = '/api';
        document.getElementById('go-to-login').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('signup-form').style.display = 'none'; document.getElementById('login-form').style.display = 'block'; });
        document.getElementById('go-to-signup').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('login-form').style.display = 'none'; document.getElementById('signup-form').style.display = 'block'; });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        firstName: document.getElementById('signup-fname').value, lastName: document.getElementById('signup-lname').value, 
                        email: document.getElementById('signup-email').value, password: document.getElementById('signup-password').value, 
                        gender: 'Prefer not to say', role: document.getElementById('signup-role').value, 
                        location: document.getElementById('signup-location').value 
                    })
                });
                if (response.ok) { alert('Account created! Please log in.'); document.getElementById('go-to-login').click(); } 
                else { const data = await response.json(); document.getElementById('signup-error').textContent = data.message; document.getElementById('signup-error').style.display = 'block'; }
            } catch (error) { document.getElementById('signup-error').textContent = 'Server offline.'; document.getElementById('signup-error').style.display = 'block'; }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('login-email').value, password: document.getElementById('login-password').value })
                });
                const data = await response.json();
                if (response.ok) { executeLogin(data.firstName, document.getElementById('login-email').value, data.token, data.role, data.userId); } 
                else { document.getElementById('login-error').textContent = data.message; document.getElementById('login-error').style.display = 'block'; }
            } catch (error) { document.getElementById('login-error').textContent = 'Cannot connect to server.'; document.getElementById('login-error').style.display = 'block'; }
        });

        function executeLogin(name, email, token, role, userId) {
            localStorage.clear();
            localStorage.setItem('authToken', token || '');
            localStorage.setItem('userName', name || '');
            localStorage.setItem('userRole', role || 'student'); 
            if (userId) localStorage.setItem('userId', userId);
            if (role === 'seller') window.location.href = 'Seller/SellerUI.html'; 
            else window.location.href = 'Buyer/BuyerUI.html'; 
        }
    </script>
</body>
</html>
