<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Product — Eduvos Marketplace</title>
  <link rel="stylesheet" href="css/seller.css">
  <style>
    .stocktaking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px; margin-bottom: 40px; }
    .upload-area { background: var(--bg); border: 2px dashed #cbd5e1; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; cursor: pointer; transition: all var(--transition); min-height: 500px; position: relative; overflow: hidden; }
    .upload-area:hover { border-color: var(--blue); background: var(--blue-soft); }
    .upload-area input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    #image-preview { display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 10; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--navy); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); outline: none; font-size: 14.5px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--blue); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-upload { background: var(--blue); color: #fff; border: 0; padding: 16px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; cursor: pointer; transition: background var(--transition); width: 100%; margin-top: 10px; }
    .btn-upload:hover { background: var(--blue-dark); }
    @media (max-width: 820px) { .stocktaking-grid { grid-template-columns: 1fr; } }
    #progress-container { display: none; margin-top: 20px; }
    #progress-bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.3s ease; border-radius: 5px; }
    #success-msg { display: none; color: var(--green); text-align: center; font-size: 18px; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="Seller/SellerUI.html"><i>E</i>duvos Marketplace</a>
      <nav class="nav">
        <a href="Seller/SellerUI.html">Dashboard</a>
        <a href="Seller/stocktaking.html" class="active">Stocktaking</a>
        <a href="Seller/clientorders.html">Client Orders</a>
        <a href="Seller/sellenquires.html">Enquiries</a>
        <a href="Seller/sellerchat.html">Chat</a>
      </nav>
      <div class="account">
        <span class="meta" style="font-weight: 600; color: var(--blue); margin-right: 10px;">Welcome, <span id="nav-username">Seller</span></span>
        <button class="btn ghost" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>
  <main class="wrap layout" style="display: block;">
    <section class="panel fade-in">
      <h2 style="color: var(--blue); margin-bottom: 8px;">Add New Product</h2>
      <p class="meta" style="margin-bottom: 24px;">Upload an image and fill in the details to list your item on the marketplace.</p>
      <form id="add-product-form" enctype="multipart/form-data">
        <div class="stocktaking-grid">
          <div class="upload-area" id="upload-area">
            <input type="file" name="image" id="file-input" accept="image/*" required>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:64px; margin-bottom:16px; color:var(--muted);">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <h3>Click to upload image</h3>
            <p>JPG or PNG (max. 10MB)</p>
            <img id="image-preview" src="" alt="Preview">
          </div>
          <div class="form-panel">
            <div class="form-group">
              <label>Product Title</label>
              <input type="text" name="title" placeholder="e.g., Campus Hoodie" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Category</label>
                <select name="category_id" required>
                  <option value="1">Shop</option>
                  <option value="2">Services</option>
                  <option value="3">Food & Drinks</option>
                  <option value="4">Fashion</option>
                  <option value="5">Tutoring</option>
                  <option value="6">Tech & Study</option>
                  <option value="7">Events</option>
                </select>
              </div>
              <div class="form-group">
                <label>Price (R)</label>
                <input type="number" step="0.01" name="price" placeholder="0.00" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" name="stock" placeholder="10" required>
              </div>
              <div class="form-group">
                <label>Delivery Fee (R)</label>
                <input type="number" step="0.01" name="delivery_fee" placeholder="0.00">
              </div>
            </div>
            <div class="form-group">
              <label>Location (Campus)</label>
              <select name="location" required>
                <option value="Pretoria">Pretoria</option>
                <option value="Midrand">Midrand</option>
                <option value="Durban">Durban</option>
                <option value="Cape Town">Cape Town</option>
              </select>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea name="description" rows="3" placeholder="Describe your product..." required></textarea>
            </div>
            <button type="submit" class="btn-upload">Upload Product</button>
            <div id="progress-container">
              <div style="height:10px; background:var(--line); border-radius:5px; overflow:hidden;">
                <div id="progress-bar"></div>
              </div>
              <p id="progress-text" style="text-align:center; font-size:12px; margin-top:5px; color:var(--muted);">Uploading...</p>
            </div>
            <h2 id="success-msg">✅ Uploaded Successfully!</h2>
          </div>
        </div>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('nav-username').textContent = localStorage.getItem('userName') || 'Seller';
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });
    
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('image-preview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.querySelector('.upload-area svg').style.display = 'none';
          document.querySelector('.upload-area h3').style.display = 'none';
          document.querySelector('.upload-area p').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('add-product-form').onsubmit = function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      formData.append('seller_id', localStorage.getItem('userId'));
      
      const xhr = new XMLHttpRequest();
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const successMsg = document.getElementById('success-msg');
      
      progressContainer.style.display = 'block';
      successMsg.style.display = 'none';
      
      xhr.upload.onprogress = function(event) {
        if (event.lengthComputable) {
          const percent = (event.loaded / event.total) * 100;
          progressBar.style.width = percent + '%';
          progressText.textContent = `Uploading... ${Math.round(percent)}%`;
        }
      };
      
      xhr.onload = function() {
        if (xhr.status === 200) {
          progressContainer.style.display = 'none';
          successMsg.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'Seller/SellerUI.html';
          }, 2000);
        } else {
          alert('Upload failed. Please try again.');
          progressContainer.style.display = 'none';
        }
      };
      
      xhr.open('POST', '/api/products');
      xhr.send(formData);
    };
  </script>
</body>
</html>
