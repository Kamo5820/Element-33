<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Seller Profile — Eduvos Marketplace</title>
  <link rel="stylesheet" href="css/seller.css">
  <style>
    .profile-pic-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid var(--blue-soft); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 15px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="Seller/SellerUI.html"><i>E</i>duvos Marketplace</a>
      <nav class="nav">
        <a href="Seller/SellerUI.html">Dashboard</a>
        <a href="Seller/stocktaking.html">Stocktaking</a>
        <a href="Seller/clientorders.html">Client Orders</a>
        <a href="Seller/sellenquires.html">Enquiries</a>
        <a href="Seller/sellerchat.html">Chat</a>
      </nav>
      <div class="account">
        <span class="meta" style="font-weight: 600; color: var(--blue); margin-right: 10px;">Welcome, <span id="nav-username">Seller</span></span>
        <button class="btn ghost" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>
  <main class="wrap" style="padding-top: 40px; max-width: 600px; min-height: 70vh;">
    <div class="panel fade-in">
      <h2>Update Shop Profile</h2>
      <p class="meta" style="margin-bottom: 20px;">Your profile helps buyers trust and reach you.</p>
      
      <form id="profile-form">
        <div style="text-align:center; margin-bottom: 20px;">
            <img id="pic-preview" class="profile-pic-preview" src="https://via.placeholder.com/100" alt="Profile">
            <input type="file" id="profile_pic" name="profile_pic" accept="image/*" style="display:block; margin: 10px auto;">
        </div>
        <div class="form-group">
            <label>Bio</label>
            <textarea id="bio" name="bio" rows="3" placeholder="Describe your shop and products..."></textarea>
        </div>
        <div class="form-group">
            <label>Location (Campus)</label>
            <select id="location" name="location">
                <option value="Pretoria">Pretoria</option>
                <option value="Midrand">Midrand</option>
                <option value="Durban">Durban</option>
                <option value="Cape Town">Cape Town</option>
            </select>
        </div>
        <button type="submit" class="btn primary" style="width:100%; padding:15px;">Save Changes</button>
      </form>
    </div>
  </main>
  <script>
    const userId = localStorage.getItem('userId');
    document.getElementById('nav-username').textContent = localStorage.getItem('userName') || 'Seller';
    document.getElementById('logout-btn').addEventListener('click', () => window.location.href = '/index.html');
    
    document.getElementById('profile_pic').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => document.getElementById('pic-preview').src = ev.target.result;
            reader.readAsDataURL(file);
        }
    };

    async function loadProfile() {
        try {
            const res = await fetch(`/api/user/${userId}`);
            const user = await res.json();
            document.getElementById('bio').value = user.bio || '';
            document.getElementById('location').value = user.location || 'Pretoria';
            if (user.profile_pic) document.getElementById('pic-preview').src = user.profile_pic;
        } catch(e) {}
    }
    loadProfile();

    document.getElementById('profile-form').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            await fetch(`/api/user/${userId}`, { method: 'PUT', body: formData });
            alert('Profile updated successfully!');
        } catch(e) {
            alert('Error saving profile');
        }
    };
  </script>
</body>
</html>
